<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasoko Admin</title>
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="admin-shell">
    <section id="loginView" class="auth-card">
      <div class="admin-brand">KASOKO <span>ADMIN</span></div>
      <h1>Admin Login</h1>
      <p class="muted">Sign in to manage the Kasoko product catalogue.</p>
      <form id="loginForm">
        <label>Email
          <input id="email" type="email" autocomplete="email" required>
        </label>
        <label>Password
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn primary" type="submit">Sign in</button>
      </form>
      <p id="loginMessage" class="message" aria-live="polite"></p>
      <a class="back-link" href="index.html">← Back to shop</a>
    </section>

    <section id="dashboardView" class="dashboard hidden">
      <header class="dashboard-header">
        <div>
          <div class="admin-brand">KASOKO <span>ADMIN</span></div>
          <h1>Product Management</h1>
          <p id="adminEmail" class="muted"></p>
        </div>
        <div class="header-actions">
          <a class="btn secondary" href="index.html">View Shop</a>
          <button id="logoutBtn" class="btn danger" type="button">Sign out</button>
        </div>
      </header>

      <section class="panel">
        <div class="panel-heading">
          <div>
            <h2 id="formTitle">Add Product</h2>
            <p class="muted">Products are stored directly in Supabase.</p>
          </div>
          <button id="cancelEditBtn" class="btn secondary hidden" type="button">Cancel Edit</button>
        </div>

        <form id="productForm" class="product-form">
          <input id="productId" type="hidden">
          <label>Product name
            <input id="productName" type="text" required>
          </label>
          <label>Category
            <select id="productCategory" required>
              <option value="Bags">Bags</option>
              <option value="Jewelry">Jewelry</option>
              <option value="Watches">Watches</option>
              <option value="Other">Other</option>
            </select>
          </label>
          <label>Price
            <input id="productPrice" type="number" min="0" step="0.01" required>
          </label>
          <label>Currency
            <input id="productCurrency" type="text" value="FBU" maxlength="10" required>
          </label>
          <label>Size
            <input id="productSize" type="text" placeholder="One Size">
          </label>
          <label>Image path / URL
            <input id="productImage" type="text" placeholder="assets/watch3.jpg">
          </label>
          <label class="full">Description
            <textarea id="productDescription" rows="4"></textarea>
          </label>
          <label class="checkbox full">
            <input id="productAvailable" type="checkbox" checked>
            Product is available
          </label>
          <div class="form-actions full">
            <button class="btn primary" type="submit" id="saveProductBtn">Add Product</button>
          </div>
        </form>
        <p id="formMessage" class="message" aria-live="polite"></p>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <div>
            <h2>Products</h2>
            <p id="productCount" class="muted"></p>
          </div>
          <button id="refreshBtn" class="btn secondary" type="button">Refresh</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Image</th>
                <th>Product</th>
                <th>Category</th>
                <th>Price</th>
                <th>Available</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="productsTable"></tbody>
          </table>
        </div>
        <p id="tableMessage" class="message" aria-live="polite"></p>
      </section>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
